name: students_reminder
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_auth: ^5.4.3
  firebase_core: ^3.8.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.2.10

  # UI and Navigation
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3
  image_picker: ^1.2.0
  crop_your_image: ^2.0.0
  permission_handler: ^11.0.1
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  table_calendar: ^3.1.2
  geolocator: ^10.1.0
  google_maps_flutter: ^2.7.0
  geocoding: ^2.0.1 
  flutter_local_notifications: ^17.2.3
  lottie: ^3.1.2

   # Charts
  pie_chart: ^5.4.0
  fl_chart: ^0.68.0

  # State management
  provider: ^6.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
    - assests/


    # Configure flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assests/logo12.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assests/logo12.png"
  adaptive_icon_round: true
  web:
    generate: true
    image_path: "assests/logo12.png"
    background_color: "#2196F3"
    theme_color: "#1976D2"
  windows:
    generate: true
    image_path: "assests/logo12.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assests/logo12.png"


 
